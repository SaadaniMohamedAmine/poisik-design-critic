<style>
        body {
            background-color: #0a0f16;
            color: #dee2ed;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .accent-glow-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(98, 148, 218, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .luxe-card {
            background-color: #0f141b;
            border: 1px solid #1d2b3f;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-luxe {
            background-color: #171c23;
            border: 1px solid #263954;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-luxe:focus {
            border-color: #6294da;
            outline: none;
            box-shadow: 0 0 0 1px #6294da;
        }

        .btn-primary {
            background-color: #6294da;
            transition: transform 0.1s ease, opacity 0.2s ease;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid #263954;
            transition: background-color 0.2s ease;
        }

        .btn-secondary:hover {
            background-color: #162131;
            border-color: #3f4756;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }

        /* Hide TopNavBar as per task instructions for task-focused screens */
    </style>

<body class="flex flex-col min-h-screen items-center justify-center relative px-margin py-xl">
<div class="accent-glow-bg"></div>
<main class="w-full max-w-[440px] z-10">
<!-- Auth Card -->
<div class="luxe-card rounded-xl p-lg md:p-xl flex flex-col gap-lg">
<!-- Wordmark Header -->
<div class="text-center">
<span class="font-headline-md text-headline-md font-bold lowercase tracking-tighter text-on-surface">poisik</span>
<h1 class="font-headline-lg text-headline-lg mt-sm text-on-surface">Create your account</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Expert AI auditing for modern interfaces.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="email">Email address</label>
<input class="input-luxe rounded-lg px-md py-sm text-on-surface font-body-md w-full placeholder:text-outline" id="email" placeholder="name@company.com" type="email"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="password">Password</label>
<input class="input-luxe rounded-lg px-md py-sm text-on-surface font-body-md w-full" id="password" placeholder="••••••••" type="password"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="confirm-password">Confirm Password</label>
<input class="input-luxe rounded-lg px-md py-sm text-on-surface font-body-md w-full" id="confirm-password" placeholder="••••••••" type="password"/>
</div>
<button class="btn-primary mt-sm rounded-lg py-sm px-md font-label-md text-label-md text-on-primary font-bold uppercase tracking-wider" type="submit">
                    Sign Up
                </button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-sm">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-md font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">or sign up with</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Social Buttons -->
<div class="flex flex-col sm:flex-row gap-sm">
<button class="btn-secondary flex-1 flex items-center justify-center gap-sm py-sm rounded-lg">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-1 .67-2.28 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.67-.35-1.39-.35-2.09s.13-1.42.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-label-md text-label-md text-on-surface">Google</span>
</button>
<button class="btn-secondary flex-1 flex items-center justify-center gap-sm py-sm rounded-lg">
<svg class="w-5 h-5 text-[#1877F2]" fill="currentColor" viewbox="0 0 24 24">
<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
</svg>
<span class="font-label-md text-label-md text-on-surface">Facebook</span>
</button>
</div>
<!-- Footer Link -->
<p class="text-center font-label-md text-label-md text-on-surface-variant mt-sm">
                Already have an account? <a class="text-primary hover:underline transition-all" href="#">Log In</a>
</p>
</div>
</main>
<!-- Footer (Suppressed Nav Shell but showing required minimalist Footer) -->
<footer class="w-full mt-xxl max-w-[1280px] mx-auto z-10">
<div class="flex flex-col md:flex-row justify-between items-center py-xl px-margin border-t border-outline-variant gap-lg">
<span class="font-headline-md text-headline-md font-bold lowercase text-on-surface">poisik</span>
<div class="flex flex-wrap justify-center gap-lg">
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors" href="#">Support</a>
</div>
<p class="font-label-md text-label-md text-on-surface-variant">© 2024 Poisik AI. All rights reserved.</p>
</div>
</footer>
<script>
        // Micro-interaction for social buttons
        document.querySelectorAll('.btn-secondary, .btn-primary').forEach(btn => {
            btn.addEventListener('mousedown', () => {
                btn.style.transform = 'scale(0.96)';
            });
            btn.addEventListener('mouseup', () => {
                btn.style.transform = 'scale(1)';
            });
            btn.addEventListener('mouseleave', () => {
                btn.style.transform = 'scale(1)';
            });
        });

        // Subtle parallax movement for the glow based on mouse
        document.addEventListener('mousemove', (e) => {
            const glow = document.querySelector('.accent-glow-bg');
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            glow.style.background = `radial-gradient(circle at ${x}% ${y}%, rgba(98, 148, 218, 0.08) 0%, transparent 70%)`;
        });
    </script>
</body></html>
