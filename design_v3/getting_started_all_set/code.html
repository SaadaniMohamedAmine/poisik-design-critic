<style>
    body {
      background-color: #0f141b;
      color: #dee2ed;
      font-family: 'Inter', sans-serif;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .check-filled {
      font-variation-settings: 'FILL' 1;
    }
    .custom-border {
      border: 1px solid #1d2b3f;
    }
    .luxe-shadow {
      box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.4);
    }
    .ghost-button-hover:hover {
      background-color: #162131;
      border-color: #263954;
    }
    .transition-luxe {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-margin overflow-hidden">
<!-- Background Ambience -->

<main class="relative z-10 w-full max-w-[1280px] flex justify-center items-center">
<!-- Checklist Widget Shell -->
<div class="w-full max-w-[420px] bg-[#0d131c] custom-border rounded-xl luxe-shadow transition-luxe overflow-hidden animate-in fade-in slide-in-from-bottom-4 duration-700" id="onboarding-widget">
<!-- Header -->
<div class="flex items-center justify-between p-lg pb-sm">
<div class="flex items-center gap-md">
<div class="flex items-center justify-center w-8 h-8 rounded-full bg-primary-container/10">
<span class="material-symbols-outlined text-primary-container check-filled" style="font-size: 20px;">
              check_circle
            </span>
</div>
<h2 class="font-headline-md text-body-md font-semibold text-on-surface tracking-tight">
            You're fully set up
          </h2>
</div>
<button class="text-outline hover:text-on-surface transition-colors duration-200">
<span class="material-symbols-outlined" style="font-size: 20px;">
            close
          </span>
</button>
</div>
<!-- Body -->
<div class="px-lg py-sm">
<p class="font-body-md text-label-md text-[#4b6c9b]">
          All onboarding steps complete — happy auditing.
        </p>
</div>
<!-- Footer -->
<div class="p-lg pt-md">
<button class="w-full h-11 flex items-center justify-center font-label-md text-on-surface custom-border rounded-lg ghost-button-hover transition-luxe group" onclick="dismissWidget()">
<span class="opacity-80 group-hover:opacity-100">Dismiss</span>
</button>
</div>
</div>
<!-- Background Decoration (Subtle Luxe Glow) -->
<div class="absolute -z-10 w-[600px] h-[600px] bg-primary/5 rounded-full blur-[120px] -top-1/2 -left-1/4"></div>
</main>
<script>
    function dismissWidget() {
      const widget = document.getElementById('onboarding-widget');
      widget.style.opacity = '0';
      widget.style.transform = 'translateY(12px) scale(0.98)';
      setTimeout(() => {
        widget.style.display = 'none';
      }, 300);
    }

    // Micro-interaction for the card lift on mouse move
    const card = document.getElementById('onboarding-widget');
    document.addEventListener('mousemove', (e) => {
      const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
      const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
      card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
    });

    document.addEventListener('mouseleave', () => {
      card.style.transform = `rotateY(0deg) rotateX(0deg)`;
    });
  </script>
</body></html>
