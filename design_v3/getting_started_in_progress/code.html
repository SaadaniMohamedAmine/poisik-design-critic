<script>
        // Micro-interaction for the checklist widget
        const widget = document.getElementById('checklist-widget');
        
        // Add a subtle entrance animation
        window.addEventListener('DOMContentLoaded', () => {
            widget.style.opacity = '0';
            widget.style.transform = 'translateY(20px)';
            setTimeout(() => {
                widget.style.transition = 'all 0.8s cubic-bezier(0.16, 1, 0.3, 1)';
                widget.style.opacity = '1';
                widget.style.transform = 'translateY(0)';
            }, 100);
        });

        // Hover effect for the progress ring
        const ring = document.querySelector('.progress-ring__circle');
        widget.addEventListener('mouseenter', () => {
            ring.style.strokeDashoffset = '58'; // Animate a tiny bit to show "life"
        });
        widget.addEventListener('mouseleave', () => {
            ring.style.strokeDashoffset = '62.83';
        });
    </script>
