<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;

<body class="font-body-md text-on-background">
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-background/80 backdrop-blur-sm p-md">
<!-- Modal Card -->
<div class="relative w-full max-w-[560px] bg-[#0d131c] border border-[#1d2b3f] p-margin rounded-lg shadow-2xl flex flex-col gap-lg">
<!-- Dismiss Button -->
<button class="absolute top-md right-md text-on-surface-variant hover:text-primary transition-colors duration-200 active:scale-95">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<!-- Headline -->
<div class="mt-base">
<h2 class="font-headline-md text-headline-md text-[#e3e9f2] tracking-tight leading-tight">
                    Three steps to a sharper design
                </h2>
</div>
<!-- Steps Stack -->
<div class="flex flex-col gap-md">
<!-- Step 1 -->
<div class="flex items-start gap-md group">
<div class="flex-shrink-0 w-10 h-10 rounded bg-[#1d2b3f]/30 border border-[#1d2b3f] flex items-center justify-center text-[#6294da] group-hover:border-[#6294da]/50 transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="upload">upload</span>
</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-[#e3e9f2] font-semibold">Upload</span>
<p class="font-label-md text-label-md text-[#87a1c5]">Drop a screenshot or paste a live URL</p>
</div>
</div>
<!-- Step 2 -->
<div class="flex items-start gap-md group">
<div class="flex-shrink-0 w-10 h-10 rounded bg-[#1d2b3f]/30 border border-[#1d2b3f] flex items-center justify-center text-[#6294da] group-hover:border-[#6294da]/50 transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="sparkles" style="font-variation-settings: 'FILL' 1;">arrow_back_ios_new</span>
</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-[#e3e9f2] font-semibold">AI Analysis</span>
<p class="font-label-md text-label-md text-[#87a1c5]">Our engine audits accessibility, hierarchy, and consistency</p>
</div>
</div>
<!-- Step 3 -->
<div class="flex items-start gap-md group">
<div class="flex-shrink-0 w-10 h-10 rounded bg-[#1d2b3f]/30 border border-[#1d2b3f] flex items-center justify-center text-[#6294da] group-hover:border-[#6294da]/50 transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="file-text">rotate_left</span>
</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-[#e3e9f2] font-semibold">Report</span>
<p class="font-label-md text-label-md text-[#87a1c5]">Get a scored, actionable breakdown in seconds</p>
</div>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-md pt-base">
<button class="w-full bg-[#6294da] hover:bg-[#72a1e4] text-on-primary-container font-label-md text-label-md py-md rounded-lg transition-all duration-200 active:scale-[0.98] font-bold">
                    Next
                </button>
<div class="flex flex-col items-center gap-md">
<a class="text-[#4b6c9b] font-label-md text-label-md hover:text-[#6294da] transition-colors duration-200 underline-offset-4 hover:underline" href="#">
                        Back
                    </a>
<!-- Progress Dots -->
<div class="flex gap-xs items-center">
<div class="w-1.5 h-1.5 rounded-full bg-[#1d2b3f]"></div>
<div class="w-1.5 h-1.5 rounded-full bg-[#6294da]"></div>
<div class="w-1.5 h-1.5 rounded-full bg-[#1d2b3f]"></div>
</div>
</div>
</div>
</div>
</div>
<!-- Background Content Mock (The "Dashboard" underneath) -->
<main class="max-w-[1280px] mx-auto px-margin py-xxl opacity-20 pointer-events-none select-none">
<div class="h-8 w-48 bg-surface-container-high rounded mb-xl"></div>
<div class="grid grid-cols-3 gap-lg">
<div class="h-64 bg-surface-container-low border border-[#1d2b3f] rounded-xl"></div>
<div class="h-64 bg-surface-container-low border border-[#1d2b3f] rounded-xl"></div>
<div class="h-64 bg-surface-container-low border border-[#1d2b3f] rounded-xl"></div>
</div>
<div class="mt-xl h-96 bg-surface-container-low border border-[#1d2b3f] rounded-xl"></div>
</main>
<script>
        // Simple logic for micro-interactions
        document.querySelectorAll('button, a').forEach(el => {
            el.addEventListener('mouseenter', () => {
                // Potential for subtle sound or hover logic
            });
        });

        // Close modal simulation
        const closeBtn = document.querySelector('button[data-icon="close"]');
        const modal = document.querySelector('.fixed.inset-0');
        
        if(closeBtn) {
            closeBtn.addEventListener('click', () => {
                modal.classList.add('opacity-0', 'transition-opacity', 'duration-300');
                setTimeout(() => modal.style.display = 'none', 300);
            });
        }
    </script>
