<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>poisik - Welcome</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {

                    "on-secondary-container": "#adb5c7",
                    "on-primary-fixed-variant": "#004786",
                    "on-primary": "#00315f",
                    "outline": "#8c919c",
                    "surface-variant": "#30353d",
                    "on-secondary-fixed": "#141c29",
                    "on-error-container": "#ffdad6",
                    "primary-fixed-dim": "#a6c8ff",
                    "primary-fixed": "#d4e3ff",
                    "surface-container-high": "#252a32",
                    "inverse-on-surface": "#2c3139",
                    "error": "#ffb4ab",
                    "background": "#0f141b",
                    "primary-container": "#6294da",
                    "on-surface": "#dee2ed",
                    "secondary-fixed": "#dbe3f5",
                    "tertiary": "#f3bf4f",
                    "surface-container-lowest": "#090e15",
                    "on-primary-fixed": "#001c3b",
                    "secondary-container": "#3f4756",
                    "on-tertiary-container": "#3a2800",
                    "surface-container": "#1b2027",
                    "inverse-primary": "#275fa2",
                    "primary": "#a6c8ff",
                    "surface-dim": "#0f141b",
                    "inverse-surface": "#dee2ed",
                    "on-tertiary-fixed": "#261900",
                    "on-error": "#690005",
                    "surface-container-low": "#171c23",
                    "tertiary-fixed": "#ffdea2",
                    "secondary-fixed-dim": "#bfc7d9",
                    "on-secondary": "#29313f",
                    "on-primary-container": "#002b56",
                    "on-background": "#dee2ed",
                    "secondary": "#bfc7d9",
                    "surface-tint": "#a6c8ff",
                    "error-container": "#93000a",
                    "surface-bright": "#353942",
                    "on-secondary-fixed-variant": "#3f4756",
                    "on-surface-variant": "#c2c6d2",
                    "on-tertiary-fixed-variant": "#5c4200"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "sm": "8px",
                    "base": "4px",
                    "md": "16px",
                    "margin": "32px",
                    "xs": "4px",
                    "lg": "24px",
                    "xxl": "80px",
                    "xl": "48px",
                    "gutter": "24px"
            },
            "fontFamily": {
                    "body-md": ["Inter"],
                    "display-lg": ["Inter"],
                    "label-md": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "headline-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "label-sm": ["Inter"],
                    "headline-lg": ["Inter"]
            },
            "fontSize": {
                    "body-md": ["16px", {"lineHeight": "1.6", "letterSpacing": "0em", "fontWeight": "400"}],
                    "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "600"}],
                    "label-md": ["14px", {"lineHeight": "1.4", "letterSpacing": "0.01em", "fontWeight": "500"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                    "headline-md": ["24px", {"lineHeight": "1.3", "letterSpacing": "-0.02em", "fontWeight": "500"}],

                    "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.03em", "fontWeight": "600"}]

          },
        },
      }

<style>
        .modal-glow {
            box-shadow: 0 0 40px -10px rgba(95, 156, 242, 0.15);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md overflow-hidden">
<!-- Mock Background Content (Dashboard) -->
<div class="fixed inset-0 z-0 flex flex-col p-margin opacity-40 grayscale pointer-events-none">
<div class="flex justify-between items-center mb-xl">
<div class="w-32 h-8 bg-surface-container-highest rounded"></div>
<div class="flex gap-md">
<div class="w-24 h-8 bg-surface-container-highest rounded"></div>
<div class="w-24 h-8 bg-surface-container-highest rounded"></div>
</div>
</div>
<div class="grid grid-cols-3 gap-lg h-full">
<div class="col-span-2 bg-surface-container-low border border-outline-variant rounded-xl p-lg">
<div class="w-full h-full flex flex-col gap-md">
<div class="h-12 w-1/3 bg-surface-container-highest rounded"></div>
<div class="h-64 w-full bg-surface-container-highest rounded-xl"></div>
<div class="h-4 w-full bg-surface-container-highest rounded"></div>
<div class="h-4 w-4/5 bg-surface-container-highest rounded"></div>
</div>
</div>
<div class="flex flex-col gap-lg">
<div class="h-1/2 bg-surface-container-low border border-outline-variant rounded-xl"></div>
<div class="h-1/2 bg-surface-container-low border border-outline-variant rounded-xl"></div>
</div>
</div>
</div>
<!-- Full-viewport Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-background/80 backdrop-blur-md p-md">
<!-- Centered Modal Card -->
<div class="relative w-full max-w-[560px] bg-[#0d131c] border border-[#1d2b3f] rounded-xl modal-glow p-margin flex flex-col items-center transition-all duration-500 scale-100">
<!-- Dismiss (X) -->
<button class="absolute top-md right-md text-[#4b6c9b] hover:text-primary transition-colors p-base rounded-lg active:scale-95">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
<!-- Icon Badge -->
<div class="w-16 h-16 bg-[#0a0f16] border border-[#1d2b3f] rounded-xl flex items-center justify-center mb-lg">
<span class="material-symbols-outlined text-[#6294da] text-[32px]" style="font-variation-settings: 'FILL' 0;">auto_awesome</span>
</div>
<!-- Content Section -->
<div class="text-center space-y-md mb-xl">
<h1 class="font-headline-lg text-headline-lg text-[#e3e9f2] tracking-tighter">
                    Welcome to poisik
                </h1>
<p class="font-body-lg text-body-lg text-[#87a1c5] leading-[1.6] max-w-[420px] mx-auto">
                    Your AI-powered design critic — precise, fast, and built for people who ship.
                </p>
</div>
<!-- Primary Action -->
<button class="w-full bg-[#6294da] text-[#0a0f16] font-bold py-md rounded-lg font-body-md hover:bg-primary-container/90 transition-all active:scale-[0.98] mb-md shadow-lg shadow-primary-container/10">
                Next
            </button>
<!-- Secondary Link -->
<button class="text-[#4b6c9b] font-label-md text-label-md hover:text-[#6294da] transition-colors mb-xl">
                Skip intro
            </button>
<!-- Progress Dots -->
<div class="flex gap-sm">
<div class="w-2.5 h-2.5 rounded-full bg-[#6294da]"></div>
<div class="w-2.5 h-2.5 rounded-full border border-[#1d2b3f]"></div>
<div class="w-2.5 h-2.5 rounded-full border border-[#1d2b3f]"></div>
</div>
</div>
</div>
<!-- Background Atmospheric Elements -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10 overflow-hidden">
<div class="absolute -top-1/4 -right-1/4 w-[800px] h-[800px] bg-primary/5 rounded-full blur-[120px]"></div>
<div class="absolute -bottom-1/4 -left-1/4 w-[600px] h-[600px] bg-secondary/5 rounded-full blur-[100px]"></div>
</div>
<script>
        // Micro-interaction for the button
        document.querySelector('button.bg-\\[\\#6294da\\]').addEventListener('click', function() {
            const modal = this.closest('.relative');
            modal.style.transform = 'scale(0.98)';
            setTimeout(() => {
                modal.style.transform = 'scale(1)';
            }, 100);
        });

        // Close logic mock
        document.querySelector('button.absolute').addEventListener('click', function() {
            const overlay = this.closest('.fixed.inset-0.z-50');
            overlay.style.opacity = '0';
            overlay.style.transition = 'opacity 0.3s ease';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 300);
        });
    </script>
</body></html>
