</div>
<input class="w-full h-12 px-md input-field rounded text-on-surface font-body-md" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
<button class="w-full h-12 bg-primary-container text-on-primary-container font-label-md text-label-md font-bold rounded hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-sm" type="submit">
                    Sign In

</form>
<!-- Separator -->
<div class="relative my-xl">
<div aria-hidden="true" class="absolute inset-0 flex items-center">

<script>
        // Micro-interaction: Subtle mouse parallax on the glow background
        document.addEventListener('mousemove', (e) => {
            const glow = document.querySelector('.glow-overlay');
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            glow.style.transform = `translate(${moveX}px, ${moveY}px)`;
        });

        // Input field focus interaction
        const inputs = document.querySelectorAll('.input-field');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').classList.replace('text-on-surface-variant', 'text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label').classList.replace('text-primary', 'text-on-surface-variant');
            });
        });
    </script>
