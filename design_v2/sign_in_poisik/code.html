<style>
        body {
            background-color: #0a0f16;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

            direction: ltr;

        .glass-glow {
            position: relative;
        }

            content: '';

<body class="bg-background text-on-background min-h-screen flex flex-col justify-center items-center overflow-x-hidden">
<!-- Ambient Background Element -->

<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary-container rounded-full blur-[120px]"></div>

                Poisik<span class="text-primary-container">.</span>

</div>
<!-- Authentication Card -->

<header class="mb-lg">
<h2 class="text-headline-md font-headline-md text-on-surface mb-xs">Welcome back</h2>
<p class="text-body-md font-body-md text-on-surface-variant">Expert AI auditing for your design systems.</p>
</header>
<!-- Form -->
<form class="space-y-md" onsubmit="return false;">
<!-- Email Field -->
<div class="space-y-xs">
<label class="text-label-md font-label-md text-on-surface-variant block" for="email">Work Email</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px] transition-colors group-focus-within:text-primary">mail</span>
<input class="w-full bg-surface-container border border-outline-variant rounded-lg py-md pl-[48px] pr-md text-body-md font-body-md text-on-surface placeholder:text-on-surface-variant/40 focus:outline-none focus:border-primary-container transition-all" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="text-label-md font-label-md text-on-surface-variant block" for="password">Password</label>
<a class="text-label-sm font-label-sm text-primary hover:underline transition-all" href="#">Forgot password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px] transition-colors group-focus-within:text-primary">lock</span>
<input class="w-full bg-surface-container border border-outline-variant rounded-lg py-md pl-[48px] pr-md text-body-md font-body-md text-on-surface placeholder:text-on-surface-variant/40 focus:outline-none focus:border-primary-container transition-all" id="password" placeholder="••••••••" type="password"/>

<script>
        // Micro-interactions: Input focusing
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('active-field');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('active-field');
            });
        });

        // Simple Fade In Animation for the card
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.querySelector('.glass-glow');
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            card.style.transition = 'all 0.6s cubic-bezier(0.22, 1, 0.36, 1)';
            
            setTimeout(() => {
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
