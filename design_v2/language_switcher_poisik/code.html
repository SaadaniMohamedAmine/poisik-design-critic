<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f141b; /* background from config */
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 20px;
        }
        /* Custom scrollbar for Luxe aesthetic */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0f141b;
        }
        ::-webkit-scrollbar-thumb {
            background: #1d2b3f;
            border-radius: 10px;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "secondary-container": "#3f4756",
                      "on-tertiary": "#402d00",
                      "tertiary-fixed": "#ffdea2",
                      "on-surface": "#dee2ed",
                      "on-primary-fixed-variant": "#004786",
                      "outline-variant": "#424750",
                      "on-tertiary-fixed-variant": "#5c4200",
                      "surface-bright": "#353942",
                      "on-primary-container": "#002b56",
                      "tertiary-container": "#b98b1d",
                      "primary-container": "#6294da",
                      "inverse-primary": "#275fa2",
                      "on-secondary-container": "#adb5c7",
                      "surface-container-highest": "#30353d",
                      "on-surface-variant": "#c2c6d2",
                      "on-secondary-fixed-variant": "#3f4756",
                      "on-tertiary-container": "#3a2800",
                      "secondary-fixed-dim": "#bfc7d9",
                      "on-secondary": "#29313f",
                      "on-primary": "#00315f",
                      "secondary": "#bfc7d9",
                      "on-error-container": "#ffdad6",
                      "outline": "#8c919c",
                      "surface-variant": "#30353d",
                      "on-tertiary-fixed": "#261900",
                      "surface-container-high": "#252a32",
                      "primary-fixed": "#d4e3ff",
                      "secondary-fixed": "#dbe3f5",
                      "on-primary-fixed": "#001c3b",
                      "primary": "#a6c8ff",
                      "error": "#ffb4ab",
                      "surface-tint": "#a6c8ff",
                      "surface-dim": "#0f141b",
                      "on-error": "#690005",
                      "surface": "#0f141b",
                      "on-secondary-fixed": "#141c29",
                      "surface-container-low": "#171c23",
                      "surface-container": "#1b2027",
                      "inverse-on-surface": "#2c3139",
                      "surface-container-lowest": "#090e15",
                      "inverse-surface": "#dee2ed",
                      "primary-fixed-dim": "#a6c8ff",
                      "error-container": "#93000a",
                      "on-background": "#dee2ed",
                      "tertiary": "#f3bf4f",
                      "tertiary-fixed-dim": "#f3bf4f",
                      "background": "#0f141b"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "sm": "8px",
                      "xs": "4px",
                      "xxl": "80px",
                      "xl": "48px",
                      "base": "4px",
                      "gutter": "24px",
                      "md": "16px",
                      "lg": "24px",
                      "margin": "32px"
              },
              "fontFamily": {
                      "display-lg": ["Inter"],
                      "body-md": ["Inter"],
                      "headline-lg": ["Inter"],
                      "body-lg": ["Inter"],
                      "headline-md": ["Inter"],
                      "label-md": ["Inter"],
                      "label-sm": ["Inter"],
                      "headline-lg-mobile": ["Inter"]
              },
              "fontSize": {
                      "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "600"}],
                      "body-md": ["16px", {"lineHeight": "1.6", "letterSpacing": "0em", "fontWeight": "400"}],
                      "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.03em", "fontWeight": "600"}],
                      "body-lg": ["18px", {"lineHeight": "1.6", "letterSpacing": "0em", "fontWeight": "400"}],
                      "headline-md": ["24px", {"lineHeight": "1.3", "letterSpacing": "-0.02em", "fontWeight": "500"}],
                      "label-md": ["14px", {"lineHeight": "1.4", "letterSpacing": "0.01em", "fontWeight": "500"}],
                      "label-sm": ["12px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "headline-lg-mobile": ["28px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600"}]
              }
            },
          },
        }
    </script>
</head>
<body class="min-h-screen flex items-center justify-center p-xl overflow-hidden relative">
<!-- Atmospheric Subtle Gradient for Background Context -->
<div class="absolute inset-0 z-0 opacity-20 pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary-container rounded-full blur-[120px]"></div>
</div>
<!-- Dropdown Container -->
<div class="relative z-10 flex flex-col items-center" id="dropdown-scope">
<!-- Trigger Pill -->
<button class="flex items-center gap-sm px-md py-sm rounded-full bg-[#121a27] border border-[#1d2b3f] hover:border-[#263954] hover:bg-[#162131] transition-all duration-300 group" id="lang-trigger">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">language</span>
<span class="text-label-md font-label-md text-on-surface tracking-wide">EN</span>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-transform duration-300 transform" id="chevron">expand_more</span>
</button>
<!-- Dropdown Panel (Simulated open state for isolated view) -->
<div class="absolute top-12 mt-sm w-48 bg-[#121a27] border border-[#1d2b3f] rounded-xl overflow-hidden shadow-2xl shadow-black/50 transition-all duration-300 origin-top" id="lang-panel">
<div class="p-xs">
<!-- Active Option: English -->
<button class="w-full flex items-center justify-between px-md py-sm rounded-lg bg-surface-container-highest/30 group transition-all">
<span class="text-label-md font-label-md text-on-surface">English</span>
<span class="material-symbols-outlined text-[#6294da]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- Inactive Option: Français -->
<button class="w-full flex items-center justify-between px-md py-sm rounded-lg hover:bg-surface-container-highest/50 group transition-all mt-xs">
<span class="text-label-md font-label-md text-on-surface-variant group-hover:text-on-surface">Français</span>
<span class="material-symbols-outlined opacity-0 group-hover:opacity-30 text-on-surface-variant transition-opacity">check_circle</span>
</button>
<!-- Inactive Option: Deutsch (Optional addition for context) -->
<button class="w-full flex items-center justify-between px-md py-sm rounded-lg hover:bg-surface-container-highest/50 group transition-all mt-xs">
<span class="text-label-md font-label-md text-on-surface-variant group-hover:text-on-surface">Deutsch</span>
<span class="material-symbols-outlined opacity-0 group-hover:opacity-30 text-on-surface-variant transition-opacity">check_circle</span>
</button>
<!-- Inactive Option: Español (Optional addition for context) -->
<button class="w-full flex items-center justify-between px-md py-sm rounded-lg hover:bg-surface-container-highest/50 group transition-all mt-xs">
<span class="text-label-md font-label-md text-on-surface-variant group-hover:text-on-surface">Español</span>
<span class="material-symbols-outlined opacity-0 group-hover:opacity-30 text-on-surface-variant transition-opacity">check_circle</span>
</button>
</div>
<!-- Bottom Accent Line -->
<div class="h-px w-full bg-gradient-to-r from-transparent via-[#1d2b3f] to-transparent"></div>
</div>
</div>
<!-- Interaction Script -->
<script>
        const trigger = document.getElementById('lang-trigger');
        const panel = document.getElementById('lang-panel');
        const chevron = document.getElementById('chevron');
        let isOpen = true; // Initial state for the isolated view requirement

        function toggleDropdown() {
            isOpen = !isOpen;
            if (isOpen) {
                panel.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
                panel.classList.add('opacity-100', 'scale-100');
                chevron.classList.add('rotate-180');
            } else {
                panel.classList.remove('opacity-100', 'scale-100');
                panel.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
                chevron.classList.remove('rotate-180');
            }
        }

        // Handle clicks outside to close
        document.addEventListener('click', (e) => {
            if (!document.getElementById('dropdown-scope').contains(e.target)) {
                if(isOpen) toggleDropdown();
            }
        });

        trigger.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleDropdown();
        });

        // Initialize state visually
        if(isOpen) {
            panel.classList.add('opacity-100', 'scale-100');
            chevron.classList.add('rotate-180');
        } else {
            panel.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
        }
    </script>
</body></html>
