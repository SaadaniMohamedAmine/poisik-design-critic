<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign Up | Poisik AI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f141b; /* background from config */
        }

        .luxe-card {
            background-color: #171c23; /* surface-container-low */
            border: 1px solid #1d2b3f; /* Custom border hex from style guidance */
            transition: border-color 0.3s ease;
        }

        .luxe-input {
            background-color: #1b2027; /* surface-container */
            border: 1px solid #1d2b3f;
            transition: all 0.2s ease;
        }

        .luxe-input:focus {
            outline: none;
            border-color: #6294da; /* accent_signal focus rule */
        }

        .glass-overlay {
            background: radial-gradient(circle at 50% 50%, rgba(98, 148, 218, 0.03) 0%, transparent 70%);
        }
    </style>

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#3f4756",
                        "on-tertiary": "#402d00",
                        "tertiary-fixed": "#ffdea2",
                        "on-surface": "#dee2ed",
                        "on-primary-fixed-variant": "#004786",
                        "outline-variant": "#424750",
                        "on-tertiary-fixed-variant": "#5c4200",
                        "surface-bright": "#353942",
                        "on-primary-container": "#002b56",
                        "tertiary-container": "#b98b1d",
                        "primary-container": "#6294da",
                        "inverse-primary": "#275fa2",
                        "on-secondary-container": "#adb5c7",
                        "surface-container-highest": "#30353d",
                        "on-surface-variant": "#c2c6d2",
                        "on-secondary-fixed-variant": "#3f4756",
                        "on-tertiary-container": "#3a2800",
                        "secondary-fixed-dim": "#bfc7d9",
                        "on-secondary": "#29313f",
                        "on-primary": "#00315f",
                        "secondary": "#bfc7d9",
                        "on-error-container": "#ffdad6",
                        "outline": "#8c919c",
                        "surface-variant": "#30353d",
                        "on-tertiary-fixed": "#261900",
                        "surface-container-high": "#252a32",
                        "primary-fixed": "#d4e3ff",
                        "secondary-fixed": "#dbe3f5",
                        "on-primary-fixed": "#001c3b",
                        "primary": "#a6c8ff",
                        "error": "#ffb4ab",
                        "surface-tint": "#a6c8ff",
                        "surface-dim": "#0f141b",
                        "on-error": "#690005",
                        "surface": "#0f141b",

                        "surface-container-low": "#171c23",
                        "surface-container": "#1b2027",
                        "inverse-on-surface": "#2c3139",
                        "surface-container-lowest": "#090e15",
                        "inverse-surface": "#dee2ed",
                        "primary-fixed-dim": "#a6c8ff",
                        "error-container": "#93000a",
                        "on-background": "#dee2ed",
                        "tertiary": "#f3bf4f",
                        "tertiary-fixed-dim": "#f3bf4f",
                        "background": "#0f141b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "sm": "8px",
                        "xs": "4px",
                        "xxl": "80px",
                        "xl": "48px",
                        "base": "4px",
                        "gutter": "24px",
                        "md": "16px",
                        "lg": "24px",
                        "margin": "32px"

                    "fontFamily": {
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Inter"],

                        "headline-md": ["Inter"],

                        "label-md": ["14px", {"lineHeight": "1.4", "letterSpacing": "0.01em", "fontWeight": "500"}],
                        "label-sm": ["12px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden bg-background">
<!-- Background Atmosphere -->
<div class="absolute inset-0 glass-overlay pointer-events-none"></div>
<div class="absolute -top-40 -right-40 w-96 h-96 bg-primary/5 blur-[120px] rounded-full"></div>
<div class="absolute -bottom-40 -left-40 w-96 h-96 bg-primary/5 blur-[120px] rounded-full"></div>
<main class="w-full max-w-md px-margin relative z-10 flex flex-col items-center">
<!-- Brand Identity -->
<div class="mb-xl text-center">
<h1 class="text-on-background font-headline-md text-headline-md font-extrabold tracking-tighter uppercase">
                Poisik
            </h1>
<p class="text-on-surface-variant font-label-md text-label-md mt-xs tracking-wide">
                Advanced AI Auditing Interface
            </p>
</div>
<!-- Auth Card -->
<div class="luxe-card w-full p-xl rounded-xl shadow-2xl">
<h2 class="text-on-surface font-headline-md text-headline-md mb-lg">Create Account</h2>
<form class="space-y-lg" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="space-y-xs">
<label class="text-on-surface-variant font-label-md text-label-md" for="email">Email Address</label>
<input class="luxe-input w-full px-md py-sm rounded-lg text-on-surface text-body-md font-body-md placeholder:text-outline/50" id="email" placeholder="name@company.com" type="email"/>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<label class="text-on-surface-variant font-label-md text-label-md" for="password">Password</label>
<input class="luxe-input w-full px-md py-sm rounded-lg text-on-surface text-body-md font-body-md placeholder:text-outline/50" id="password" placeholder="••••••••" type="password"/>
</div>
<!-- Confirm Password Field -->
<div class="space-y-xs">
<label class="text-on-surface-variant font-label-md text-label-md" for="confirm_password">Confirm Password</label>
<input class="luxe-input w-full px-md py-sm rounded-lg text-on-surface text-body-md font-body-md placeholder:text-outline/50" id="confirm_password" placeholder="••••••••" type="password"/>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary-container text-on-primary-container font-label-md text-label-md py-md rounded-lg hover:opacity-90 transition-all active:scale-[0.98] mt-md">
                    Sign Up
                </button>
<!-- Divider -->
<div class="relative py-md flex items-center">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-md text-outline font-label-sm text-label-sm">OR CONTINUE WITH</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Social Providers -->
<div class="space-y-md">
<!-- Google -->
<button class="w-full border border-outline-variant text-on-surface font-label-md text-label-md py-sm rounded-lg flex items-center justify-center gap-md hover:bg-surface-container-highest transition-colors">
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"></path>
</svg>
                        Google
                    </button>
<!-- Facebook (Disabled) -->
<button class="w-full border border-outline-variant/30 text-on-surface-variant/50 font-label-md text-label-md py-sm rounded-lg flex items-center justify-center gap-md cursor-not-allowed group relative opacity-60" disabled="">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
</svg>
                        Facebook
                        <span class="absolute right-md text-[10px] bg-surface-container-highest px-sm py-xs rounded text-on-surface tracking-widest uppercase opacity-100 border border-outline-variant">Coming Soon</span>
</button>
</div>
</form>
</div>
<!-- Footer / Link to Sign In -->
<div class="mt-xl text-center">
<p class="text-on-surface-variant font-body-md text-body-md">
                Already have an account? 
                <a class="text-primary font-bold hover:underline transition-all ml-xs" href="#">Sign In</a>
</p>
</div>
<footer class="mt-xxl mb-lg text-center opacity-40">
<p class="text-on-surface-variant font-label-sm text-label-sm tracking-widest uppercase">
                © 2024 Poisik AI Systems
            </p>
</footer>
</main>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('mousemove', (e) => {
            const body = document.body;
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            // Subtle parallax for background gradients
            const overlay = document.querySelector('.glass-overlay');
            overlay.style.background = `radial-gradient(circle at ${x * 100}% ${y * 100}%, rgba(98, 148, 218, 0.05) 0%, transparent 70%)`;
        });

        // Input focus effects
        const inputs = document.querySelectorAll('.luxe-input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.closest('.space-y-xs').querySelector('label').style.color = '#a6c8ff';
            });
            input.addEventListener('blur', () => {
                input.closest('.space-y-xs').querySelector('label').style.color = '#c2c6d2';
            });
        });
    </script>
</body></html>
